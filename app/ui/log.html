<!doctype html>
<html><head><meta charset="utf-8"><title>Mini Client - Game log</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#f2f2f2;font:13px "Segoe UI",system-ui,sans-serif;overflow:hidden}
#bar{height:38px;display:flex;align-items:center;-webkit-app-region:drag;border-bottom:1px solid rgba(255,255,255,.07);padding-left:12px;gap:10px}
#bar img{width:20px;height:20px}
#bar b{font-size:13px;font-weight:700;letter-spacing:.2px}
#pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.08);color:#ddd;display:flex;align-items:center;gap:6px}
#pill i{width:7px;height:7px;border-radius:50%;background:#fff}
#pill.starting i{animation:blink 1s infinite} #pill.running i{background:#4ade80;box-shadow:0 0 8px #4ade80} #pill.failed i{background:#ff5a5a} #pill.closed i{background:#777}
@keyframes blink{50%{opacity:.25}}
.sp{flex:1}
.wb{-webkit-app-region:no-drag;width:46px;height:38px;border:0;background:transparent;color:#cfcfcf;display:grid;place-items:center;cursor:pointer;transition:background .12s,color .12s}
.wb:hover{background:rgba(255,255,255,.08);color:#fff} .wb.x:hover{background:rgba(255,255,255,.14)}
.wb svg{width:11px;height:11px;stroke:currentColor;stroke-width:1.2;fill:none}
#prog{height:2px;background:transparent;position:relative;overflow:hidden}
#prog.on:after{content:"";position:absolute;top:0;bottom:0;width:30%;background:#fff;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{left:-30%}to{left:100%}}
#log{position:absolute;top:40px;bottom:40px;left:0;right:0;overflow-y:auto;padding:10px 14px;font:12px/1.55 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;word-break:break-word}
.l{display:flex;gap:12px} .l s{text-decoration:none;color:#555;flex:none} .l span{flex:1}
.info span{color:#f2f2f2} .warn span{color:#a9a9a9} .ok span{color:#4ade80} .err span{color:#ff5a5a}
#foot{position:absolute;bottom:0;left:0;right:0;height:40px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:14px;padding:0 12px;font-size:12px;color:#9a9a9a}
#foot em{font-style:normal;display:flex;align-items:center;gap:6px} #foot em i{width:7px;height:7px;border-radius:50%}
.btn{border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;border-radius:7px;padding:5px 11px;font:600 11px inherit;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.08)} .btn.on{background:#fff;color:#000;border-color:#fff}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-button{display:none}
</style></head><body>

<div class="sp"></div><button class="btn on" id="follow" onclick="toggleFollow()">Follow</button><button class="btn" onclick="copyAll()">Copy log</button><button class="btn" onclick="mc.openFolder('logs')">Open folder</button></div>
<script>
const $=(i)=>document.getElementById(i), box=$('log');
let all=[], follow=true, nok=0, nerr=0;
const NAMES={starting:'Starting',running:'Running',closed:'Closed',failed:'Error',idle:'Waiting'};
function ts(t){const d=new Date(t);return d.toTimeString().slice(0,8);}
function add(l){all.push(l);if(l.kind==='ok')nok++;if(l.kind==='err')nerr++;
  const d=document.createElement('div');d.className='l '+l.kind;const a=document.createElement('s');a.textContent=ts(l.t);const b=document.createElement('span');b.textContent=l.text;d.append(a,b);box.append(d);
  while(box.childElementCount>4000)box.firstChild.remove();
  $('nok').textContent=nok;$('nerr').textContent=nerr;if(follow)box.scrollTop=box.scrollHeight;}
function state(s){$('pill').className=s;$('st').textContent=NAMES[s]||s;$('prog').className=s==='starting'?'on':'';}
function toggleFollow(){follow=!follow;$('follow').className='btn'+(follow?' on':'');if(follow)box.scrollTop=box.scrollHeight;}
box.addEventListener('wheel',e=>{if(e.deltaY<0&&follow)toggleFollow();});
function copyAll(){navigator.clipboard.writeText(all.map(l=>ts(l.t)+'  '+l.text).join('\n'));}
mc.logInit().then(r=>{r.lines.forEach(add);state(r.state);});
mc.onLog(add); mc.onLogState(state);
mc.onLogReset(()=>{all=[];nok=0;nerr=0;box.innerHTML='';state('starting');});
</script></body></html>
