name: Deploy friends server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare secrets
        id: chk
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then echo "Cloudflare secrets not set yet - skipping deploy."; echo "go=no" >> $GITHUB_OUTPUT; else echo "go=yes" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.go == 'yes'
        with: { node-version: 20 }
      - name: Deploy worker
        if: steps.chk.outputs.go == 'yes'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 deploy 2>&1 | tee deploy.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.txt | head -1)
          test -n "$URL"
          echo "{\"url\":\"$URL\"}" > ../server.json
          cat ../server.json
      - name: Publish server address for the launcher
        if: steps.chk.outputs.go == 'yes'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view server >/dev/null 2>&1 || gh release create server --title "Friends server" --notes "Address of the Mini Client friends server, read by the launcher." --prerelease
          gh release upload server server.json --clobber
