name: Build Mini Client app

on:
  push:
    branches: [main, beta]
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exe
        working-directory: app
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "beta" ]; then TAG=app-beta; else TAG=app-latest; fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          npm install --no-audit --no-fund 2>&1 | tail -5
          npm version "1.0.${GITHUB_RUN_NUMBER}" --no-git-tag-version --allow-same-version
          npx electron-builder --win nsis --publish never 2>&1 | tee ../app-build.log | tail -30
      - name: Publish release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $TAG >/dev/null 2>&1 || gh release create $TAG --title "Mini Client app ($TAG)" --notes "Mini Client $TAG build" --target $GITHUB_SHA
          gh release upload $TAG app/dist/MiniClient-Setup.exe app/dist/latest.yml app/dist/MiniClient-Setup.exe.blockmap --clobber
      - name: Push build log
        if: always()
        shell: bash
        run: |
          git config user.name "build"; git config user.email "build@users.noreply.github.com"
          git checkout --orphan applog; git rm -rf . >/dev/null 2>&1 || true
          cp ../app-build.log ./app-build.log 2>/dev/null || cp app-build.log . 2>/dev/null || echo "no log" > app-build.log
          git add app-build.log; git commit -qm "app build log"; git push -f origin applog
